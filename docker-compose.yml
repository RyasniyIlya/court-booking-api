services:
  db:
    image: postgres:16-alpine
    container_name: courts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: courts
    ports:
      - "5432:5432"
    volumes:
      - courts-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Міграції не стартують, доки база реально не приймає підключення
      test: ["CMD-SHELL", "pg_isready -U postgres -d courts"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  courts-pgdata:
