# Render Blueprint. Підключаєш репозиторій — сервіс піднімається сам.
#
# План starter, а не free: безкоштовний засинає після 15 хвилин тиші, і перший
# запит чекає холодний старт. Демо клубу на дзвінку цього не пробачить,
# а вебхук платіжки може прийти в момент, коли сервіс спить.
services:
  - type: web
    name: court-booking-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      # Пулений рядок підключення з дашборда Neon (хост з "-pooler"). Вставити вручну.
      - key: DATABASE_URL
        sync: false

      # Той самий Neon, але БЕЗ "-pooler" у хості — окреме поле в дашборді
      # Neon "Connection string" -> "Direct connection". Обов'язково: без
      # нього `prisma migrate deploy` падає з P1002 (advisory lock не тримається
      # через PgBouncer transaction-pooling).
      - key: DIRECT_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      # Ключ шифрування токенів еквайрингу клубів.
      # УВАГА: якщо колись зміниш його — усі збережені токени стануть
      # нечитабельними, клубам доведеться ввести їх заново.
      - key: PAYMENTS_SECRET
        generateValue: true

      # Тестова платіжка (провайдер "mock") працює без окремої змінної —
      # її вмикає сам клуб у налаштуваннях. Щоб закрити заглушку зовсім,
      # додати тут DEMO_PAYMENTS зі значенням "false".

      # Публічна адреса цього ж сервісу — для webHookUrl платіжки.
      # Render підставляє хост без схеми, тому publicBase() сам додає https://
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: court-booking-api
          property: host

      # Звідки пускати кабінет адміністратора (CORS). Кома як роздільник.
      # Наприклад: https://court-booking.vercel.app
      - key: ADMIN_ORIGINS
        sync: false

      # Запасна адреса повернення з платіжки, якщо віджет не передав свою
      - key: PUBLIC_WIDGET_RETURN_URL
        sync: false

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      # Вхідні команди приходять від Telegram через webhook. URL API бере
      # автоматично з PUBLIC_API_URL; випадковий секрет захищає endpoint.
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true

      # О котрій слати щоденне зведення — за часом клубу. Без цієї змінної
      # 21:00; тут стоїть явно, щоб її було видно в панелі Render.
      - key: DIGEST_HOUR
        value: "21"

      # Оператор платформи (/platform). Без обох — панель віддає 503.
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD_HASH
        sync: false

      - key: PORT
        value: 3000
